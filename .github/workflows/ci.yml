name: ShopEase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install flask pytest

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t shopease-app:${{ github.sha }} .

      - name: Test Docker container
        run: |
          docker run -d --name shopease-test -p 8080:5000 shopease-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/health
          docker rm -f shopease-test
